name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "dev"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        if: ${{ success() || failure() }}
        uses: ShawnXxy/metrics@fix/deprecated-projects-and-null-guards
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: devdacs
          filename: github-metrics.svg
          base: ""
          output_action: commit
          retries: 3
          retries_delay: 30

      - name: Achievements
        if: ${{ success() || failure() }}
        uses: ShawnXxy/metrics@fix/deprecated-projects-and-null-guards
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: devdacs
          filename: metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          output_action: commit
          retries: 3
          retries_delay: 30

      - name: Mildly interesting facts
        if: ${{ success() || failure() }}
        uses: ShawnXxy/metrics@fix/deprecated-projects-and-null-guards
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: devdacs
          filename: metrics-habits-facts.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          config_timezone: Asia/Manila
          output_action: commit
          retries: 3
          retries_delay: 30

      - name: Recent activity charts
        if: ${{ success() || failure() }}
        uses: ShawnXxy/metrics@fix/deprecated-projects-and-null-guards
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: devdacs
          filename: metrics-habits-charts.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Asia/Manila
          output_action: commit
          retries: 3
          retries_delay: 30
